<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
        .page { display: none; padding: 20px; animation: fadeIn 0.3s; }
        .active { display: block; }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }

        input, select { 
            width: 85%; padding: 14px; margin: 10px 0; 
            background: #1a1a1a; border: 1px solid #333; 
            color: #fff; border-radius: 12px; outline: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        .btn { 
            background: linear-gradient(135deg, #e91e63, #c2185b); 
            color: #fff; border: none; padding: 14px; 
            border-radius: 12px; cursor: pointer; font-weight: bold; 
            width: 90%; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.3);
        }

        .game-container {
            background: radial-gradient(circle, #1a1a1a, #000);
            width: 90%; margin: 20px auto; height: 230px;
            border-radius: 20px; position: relative; overflow: hidden;
            border: 1px solid #222; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
        }

        #plane { position: absolute; bottom: 20px; left: 20px; width: 45px; display: none; z-index: 5; }
        .flying { display: block !important; animation: movePlane 10s infinite linear; }
        @keyframes movePlane { 0% { transform: translate(0, 0); } 100% { transform: translate(280px, -160px); } }
        
        #multiplier { font-size: 50px; font-weight: bold; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
        .crashed { color: #ff0000 !important; }

        .nav-bar { position: fixed; bottom: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav-bar span { cursor: pointer; font-size: 14px; }
        
        .profile-card { background: #151515; padding: 20px; border-radius: 15px; margin: 10px; border: 1px solid #222; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="login-page" class="page active">
        <h1 style="color:#e91e63; margin-bottom: 5px;">Aviator</h1>
        <h3 style="margin-top: 0; opacity: 0.8;">Aviator Login</h3>
        <input type="email" id="l-email" placeholder="Email Address">
        <input type="password" id="l-pass" placeholder="Password">
        <button class="btn" onclick="login()">LOGIN</button>
        <p onclick="showPage('reg-page')" style="color:#007bff; cursor:pointer;">Create Account</p>
    </div>

    <div id="reg-page" class="page">
        <h2>Register</h2>
        <input type="email" id="r-email" placeholder="Email">
        <input type="password" id="r-pass" placeholder="Password">
        <input type="password" id="r-cpass" placeholder="Confirm Password">
        <button class="btn" onclick="register()">REGISTER</button>
        <p onclick="showPage('login-page')" style="cursor:pointer;">Login</p>
    </div>

    <div id="game-page" class="page">
        <div style="display:flex; justify-content:space-between; padding: 5px 15px;">
            <small id="u-id" style="opacity: 0.6;">ID: --</small>
            <small style="color:#28a745; font-weight: bold;">Balance: <span id="u-bal">0.00</span></small>
        </div>
        <div class="game-container">
            <div id="multiplier">1.00x</div>
            <svg id="plane" viewBox="0 0 24 24" fill="#e91e63"><path d="M21,16L22,13L21,10L15,10L12,2L9,2L12,10L5,10L3,7L2,7L3,11L2,15L3,15L5,12L12,12L9,20L12,20L15,12L21,12L22,15L21,18V16Z" /></svg>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; margin-bottom: 10px;">
            <button class="btn" style="width:50px; background:#333;" onclick="changeBet(-10)">-</button>
            <input type="number" id="bet-amount" value="10" readonly style="width:80px; margin:0;">
            <button class="btn" style="width:50px; background:#333;" onclick="changeBet(10)">+</button>
        </div>
        <button class="btn" id="main-btn" style="background:#28a745;" onclick="handleAction()">BET</button>

        <div class="nav-bar">
            <span onclick="showPage('game-page')">🏠 Home</span>
            <span onclick="showPage('profile-page')">👤 Profile</span>
        </div>
    </div>

    <div id="profile-page" class="page">
        <h3>User Profile</h3>
        <div class="profile-card">
            <p>Email: <span id="p-email">--</span></p>
            <p>Balance: <span id="p-bal" style="color:#28a745;">0.00</span> BDT</p>
        </div>
        <button class="btn" style="background:#007bff; margin-bottom:10px;" onclick="showPage('deposit-page')">Deposit</button>
        <button class="btn" style="background:#444" onclick="showPage('withdraw-page')">Withdraw</button>
        
        <div class="nav-bar">
            <span onclick="showPage('game-page')">🏠 Home</span>
            <span onclick="showPage('profile-page')">👤 Profile</span>
        </div>
    </div>

    <div id="deposit-page" class="page">
        <h3>Select ↓</h3>
        <select id="d-method"><option>Coming Soon</option><option>Bkash</option></select>
        <p>Send Money :01331565448</p>
        <input type="number" id="d-amount" placeholder="Amount">
        <input type="text" id="d-trx" placeholder="TRX ID">
        <button class="btn" onclick="sendDep()">Submit</button>
        <p onclick="showPage('profile-page')" style="cursor:pointer;">Cancel</p>
    </div>

    <div id="withdraw-page" class="page">
        <h3>Select ↓</h3>
        <select id="w-method"><option>Nagod</option><option>Coming Soon</option></select>
        <input type="number" id="w-amount" placeholder="Min Amount 320">
        <input type="text" id="w-num" placeholder="Number">
        <button class="btn" onclick="sendWit()">Send Request</button>
        <p onclick="showPage('profile-page')" style="cursor:pointer;">Cancel</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBuXapjIrkCVuONI4qXfSS0TVOZt_ZXxLE",
            authDomain: "casino-7ceda.firebaseapp.com",
            databaseURL: "https://casino-7ceda-default-rtdb.firebaseio.com",
            projectId: "casino-7ceda",
            storageBucket: "casino-7ceda.firebasestorage.app",
            messagingSenderId: "307176424721",
            appId: "1:307176424721:web:18dfeb258d105e62a0b8b0"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let user = null, isFlying = false, currentMult = 1.0, hasBet = false, myBetAmount = 0;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            let targetPage = document.getElementById(id);
            if(targetPage) targetPage.classList.add('active');
            if(user) updateUI();
        }

        function changeBet(v) { 
            let b = document.getElementById('bet-amount');
            let n = parseInt(b.value) + v;
            if(n >= 10) b.value = n;
        }

        function register() {
            let e = document.getElementById('r-email').value, p = document.getElementById('r-pass').value, cp = document.getElementById('r-cpass').value;
            if(!e || !p || p!==cp) return alert("Check Input!");
            let k = e.replace(/\./g, '_');
            db.ref('users/'+k).set({email:e, pass:p, balance:100, id:Math.floor(1000+Math.random()*9000)}).then(()=>{alert("Registration Done!"); showPage('login-page');});
        }

        function login() {
            let e = document.getElementById('l-email').value, p = document.getElementById('l-pass').value, k = e.replace(/\./g, '_');
            db.ref('users/'+k).once('value', s => {
                if(s.exists() && s.val().pass === p) { user = s.val(); showPage('game-page'); startAviator(); } else alert("Error!");
            });
        }

        function updateUI() {
            document.getElementById('u-bal').innerText = user.balance.toFixed(2);
            document.getElementById('p-bal').innerText = user.balance.toFixed(2);
            document.getElementById('p-email').innerText = user.email;
            document.getElementById('u-id').innerText = "ID: " + user.id;
        }

        function startAviator() {
            let m = document.getElementById('multiplier'), p = document.getElementById('plane'), btn = document.getElementById('main-btn');
            db.ref('game_settings/limit').once('value', s => {
                let limit = s.val() ? parseFloat(s.val()) : (1.1 + Math.random() * 3).toFixed(2);
                currentMult = 1.0; isFlying = true; m.classList.remove('crashed'); p.classList.add('flying');
                if(hasBet) { btn.innerText = "CASH OUT"; btn.style.background = "#ffc107"; btn.style.color = "#000"; }

                let t = setInterval(() => {
                    if(currentMult < limit) {
                        currentMult += 0.01; m.innerText = currentMult.toFixed(2) + "x";
                        if(hasBet) btn.innerText = "CASH OUT ("+(myBetAmount*currentMult).toFixed(2)+")";
                    } else {
                        clearInterval(t); isFlying = false; m.innerText = "CRASHED " + currentMult.toFixed(2); m.classList.add('crashed'); p.classList.remove('flying');
                        if(hasBet) { alert("Crashed!"); hasBet = false; }
                        btn.innerText = "BET"; btn.style.background = "#28a745"; btn.style.color = "#fff";
                        db.ref('game_settings/limit').set(null);
                        setTimeout(startAviator, 6000);
                    }
                }, 100);
            });
        }

        function handleAction() {
            let btn = document.getElementById('main-btn');
            if(!isFlying && !hasBet) {
                myBetAmount = parseFloat(document.getElementById('bet-amount').value);
                if(myBetAmount > user.balance) return alert("Low Balance!");
                user.balance -= myBetAmount; hasBet = true; updateUI();
                btn.innerText = "WAITING..."; btn.style.background = "#444";
            } else if(isFlying && hasBet) {
                let win = myBetAmount * currentMult; user.balance += win;
                db.ref('users/'+user.email.replace(/\./g, '_')).update({ balance: user.balance });
                alert("Won: " + win.toFixed(2)); hasBet = false; updateUI();
                btn.innerText = "BET"; btn.style.background = "#28a745";
            }
        }

        function sendDep() { 
            db.ref('deposits').push({email:user.email, amount:document.getElementById('d-amount').value, trx:document.getElementById('d-trx').value, method:document.getElementById('d-method').value}); 
            // এখানে ডিপোজিট অ্যালার্ট পরিবর্তন করা হয়েছে (১৮৫ নাম্বার লাইনের আশেপাশে)
            alert("Your deposit has been successful, the money will be added within a few moments"); 
            showPage('profile-page'); 
        }

        function sendWit() {
            let amt = parseFloat(document.getElementById('w-amount').value);
            if(amt < 320) return alert("Min 320 BDT");
            if(amt > user.balance) return alert("Low Balance!");
            db.ref('withdraws').push({email:user.email, amt:amt, num:document.getElementById('w-num').value, method:document.getElementById('w-method').value});
            user.balance -= amt;
            db.ref('users/'+user.email.replace(/\./g, '_')).update({balance: user.balance});
            // এখানে উইথড্র অ্যালার্ট পরিবর্তন করা হয়েছে (১৯৭ নাম্বার লাইনের আশেপাশে)
            alert("Your withdraw has been successful, you will get payment within 5 hours"); 
            showPage('profile-page');
        }
    </script>
</body>
</html>
