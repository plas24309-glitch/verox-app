<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verox Earning BD</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background: #000000; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .auth-page, .main-app { padding: 20px; display: none; }
        .header { background: #3b49ad; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 0 0 15px 15px; }
        .balance-box { background: #0a0a0a; padding: 12px; border-radius: 12px; border: 1px solid #fbbf24; margin: 15px 0; text-align: center; }
        .balance-box p { color: #94a3b8; font-size: 13px; margin: 0; }
        .balance-box h1 { color: #fbbf24; font-size: 32px; margin: 2px 0; }
        .card { background: #0a0a0a; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; border: 1px solid #334155; background: #1a1a1a; color: white; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 14px; background: #fbbf24; color: black; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; }
        .btn:disabled { background: #4b5563; }
        .ad-slot { width: 100%; height: 200px; background: #1a1a1a; border-radius: 10px; margin: 10px 0; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px dashed #475569; }
        #ad-frame { width: 100%; height: 100%; border: none; display: none; }
        #whatsapp-float { position: fixed; bottom: 20px; right: 20px; z-index: 9999; touch-action: none; cursor: move; }
        .logout-btn { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 15px; text-decoration: underline; cursor: pointer; display: block; }
    </style>
</head>
<body>

    <div id="authPage" class="auth-page" style="display:block;">
        <h2 id="authTitle" style="text-align:center; color:#fbbf24;">লগইন করুন</h2>
        <div class="card" style="border-color: #fbbf24;">
            <input type="email" id="uEmail" placeholder="ইমেইল">
            <input type="password" id="uPass" placeholder="পাসওয়ার্ড">
            <input type="password" id="cPass" placeholder="কনফার্ম পাসওয়ার্ড" style="display:none;">
            <button class="btn" id="authBtn" onclick="handleAuth()">Login Now</button>
            <p id="toggleText" onclick="switchAuth()" style="color:#fbbf24; cursor:pointer; margin-top:15px; font-size:13px; text-align: center;">অ্যাকাউন্ট নেই? রেজিস্ট্রেশন করুন</p>
        </div>
    </div>

    <div id="mainApp" class="main-app">
        <div class="header">Verox Earning BD</div>
        <div class="balance-box">
            <p>বর্তমান ব্যালেন্স</p>
            <h1>৳ <span id="balance">0.00</span></h1>
        </div>
        <div class="card">
            <h2>ভিডিও টাস্ক</h2>
            <div class="ad-slot"><p id="adStat" style="font-size: 12px; color: #475569;">এড দেখতে স্টার্ট এ ক্লিক করুন ! </p><iframe id="ad-frame"></iframe></div>
            <button class="btn" id="taskBtn" onclick="startWork()">Start Work</button>
        </div>
        <div class="card">
            <h2>টাকা উত্তোলন</h2>
            <input type="number" id="amt" placeholder="সর্বনিম্ন ৫০ ৳">
            <input type="number" id="phone" placeholder="নম্বর">
            <select id="method">
                <option value="" disabled selected>Select</option>
                <option id="opt1" value="Bikash">Bikash</option>
                <option id="opt2" value="Nagad">Nagad</option>
            </select>
            <button class="btn" onclick="withdraw()">Withdraw Request</button>
        </div>
        <span class="logout-btn" onclick="firebase.auth().signOut()">Logout Account</span>
    </div>

    <div id="whatsapp-float"><a href="https://wa.me/8801312048034" target="_blank" id="wa-link"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="55" draggable="false"></a></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA10jFMfbgMmsUIIquqBreP9ufDdLwOPX0", databaseURL: "https://veloxearn2-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.database();
        let curBal = 0, isDragging = false;

        // পেমেন্ট মেথড লোড
        db.ref('settings').on('value', s => {
            const d = s.val() || {};
            document.getElementById('opt1').innerText = d.m1 || "Bikash";
            document.getElementById('opt1').value = d.m1 || "Bikash";
            document.getElementById('opt2').innerText = d.m2 || "Nagad";
            document.getElementById('opt2').value = d.m2 || "Nagad";
        });

        // WhatsApp Drag
        const wa = document.getElementById('whatsapp-float');
        wa.addEventListener('touchmove', (e) => { isDragging = true; let t = e.touches[0]; wa.style.left = (t.clientX-27)+'px'; wa.style.top = (t.clientY-27)+'px'; wa.style.right='auto'; wa.style.bottom='auto'; });
        document.getElementById('wa-link').addEventListener('click', (e) => { if(isDragging) e.preventDefault(); isDragging=false; });

        function checkVPN(uid) { let v = (Intl.DateTimeFormat().resolvedOptions().timeZone !== "Asia/Dhaka"); db.ref('users/'+uid).update({ vpn_status: v?"YES":"NO" }); }

        let isLoginMode = true;
        function switchAuth() { 
            isLoginMode = !isLoginMode; 
            document.getElementById('authTitle').innerText = isLoginMode ? "লগইন করুন" : "রেজিস্ট্রেশন করুন"; 
            document.getElementById('authBtn').innerText = isLoginMode ? "Login Now" : "Register Now";
            document.getElementById('cPass').style.display = isLoginMode ? "none" : "block"; 
        }

        function handleAuth() {
            let e = document.getElementById('uEmail').value, p = document.getElementById('uPass').value;
            if(isLoginMode) auth.signInWithEmailAndPassword(e,p).catch(a=>alert("ভুল তথ্য!"));
            else auth.createUserWithEmailAndPassword(e,p).then(r=> db.ref('users/'+r.user.uid).set({email:e, balance:0, vpn_status:"NO"}));
        }

        auth.onAuthStateChanged(u => {
            if(u){ document.getElementById('authPage').style.display='none'; document.getElementById('mainApp').style.display='block'; checkVPN(u.uid);
                db.ref('users/'+u.uid+'/balance').on('value', s=>{ curBal=s.val()||0; document.getElementById('balance').innerText=curBal.toFixed(2); });
            } else { document.getElementById('authPage').style.display='block'; document.getElementById('mainApp').style.display='none'; }
        });

        function startWork() {
            db.ref('settings').once('value').then(snap => {
                const s = snap.val() || {};
                let b = document.getElementById('taskBtn'), f = document.getElementById('ad-frame'), t = s.ad_time || 10;
                b.disabled = true; f.src = s.ad_link || ""; f.style.display = "block"; document.getElementById('adStat').style.display = "none";
                let timer = setInterval(() => { b.innerText = `Wait (${t}s)`; t--;
                    if(t < 0){ clearInterval(timer); b.innerText = "Claim Reward"; b.disabled = false;
                        b.onclick = () => {
                            db.ref('users/'+auth.currentUser.uid+'/balance').transaction(x => (x||0) + (s.task_reward || 0.20));
                            alert("৳ যোগ হয়েছে️"); f.style.display = "none"; document.getElementById('adStat').style.display = "block";
                            b.innerText = "Start Work"; b.onclick = startWork;
                        };
                    }
                }, 1000);
            });
        }

        function withdraw() {
            let a = parseFloat(document.getElementById('amt').value), p = document.getElementById('phone').value, m = document.getElementById('method').value;
            if(!m) return alert("পেমেন্ট মেথড সিলেক্ট করুন!");
            if(a < 50 || a > curBal || !p) return alert("সঠিক তথ্য দিন এবং সর্বনিম্ন ৫০ টাকা সর্বোচ্চ ২০০ টাকা দিনে ২ বার উইথড্র দিতে পারবেন 💸");
            db.ref('users/'+auth.currentUser.uid+'/balance').transaction(x=>x-a);
            db.ref('withdraw_requests').push({ email: auth.currentUser.email, amount: a, phone: p, method: m });
            alert("আপনার উইথড্র সফল হয়েছে ২৪ ঘন্টার মধ্যে পেমেন্ট পেয়ে যাবেন ✅");
        }
    </script>
</body>
</html>
